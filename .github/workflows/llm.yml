name: LLM run

# Runs one LLM task (pronoun ambiguity on ReqEval, review and rewrite of PROMISE requirements)
# with a local model over a few parallel shards. Each shard is a standard CPU runner with its own
# llama.cpp server. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [pronoun, pronoun-candidates, review, classify, conflict]
        default: pronoun
      model:
        type: choice
        options: [qwen3.5-4b, granite-4.2-3b]
        default: qwen3.5-4b
      shards:
        description: Parallel runners
        default: "8"
      label:
        description: Optional suffix for the run name (e.g. a prompt version)
        default: ""

permissions:
  contents: read

env:
  LLAMA_CPP: b11327
  RUN: ${{ inputs.task }}${{ inputs.label && format('-{0}', inputs.label) || '' }}-${{ inputs.model }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - id: shards
        run: python3 -c "print('list=' + str(list(range(int('${{ inputs.shards }}')))))" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-v1-${{ hashFiles('src/spec_review/data/download.py') }}
      - run: spec-review data
      - if: inputs.task == 'conflict'
        run: spec-review conflicts-data
      - name: llama.cpp (pinned release, CPU build)
        id: llama
        uses: actions/cache@v4
        with:
          path: llama
          key: llama-cpp-${{ env.LLAMA_CPP }}-ubuntu-x64
      - if: steps.llama.outputs.cache-hit != 'true'
        run: |
          mkdir -p llama
          curl -sSfL "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_CPP/llama-$LLAMA_CPP-bin-ubuntu-x64.tar.gz" \
            | tar -xz -C llama
      - name: Model
        id: model
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ inputs.model }}-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSfL --retry 3 -o models/model.gguf "$(spec-review model-url '${{ inputs.model }}')"
      - name: Start llama-server
        run: |
          server=$(find llama -name llama-server -type f | head -1)
          export LD_LIBRARY_PATH="$(dirname "$server"):$LD_LIBRARY_PATH"
          nohup "$server" -m models/model.gguf --jinja -c 4096 -t "$(nproc)" -np 1 \
            --host 127.0.0.1 --port 8081 > server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8081/health && break; sleep 2; done
      - name: Run
        run: >
          spec-review llm-run --task ${{ inputs.task }} --model ${{ inputs.model }} --name "$RUN"
          --shard ${{ matrix.shard }} --shards ${{ inputs.shards }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-${{ env.RUN }}-${{ matrix.shard }}
          path: runs/llm/
          retention-days: 7

  merge:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: llm-${{ env.RUN }}-*
          path: shards
      - run: |
          mkdir -p "runs/llm/$RUN"
          find shards -path "*/$RUN/*.jsonl" -exec cp {} "runs/llm/$RUN/" \;
          spec-review llm-merge --name "$RUN" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ env.RUN }}
          path: runs/llm/${{ env.RUN }}/merged.jsonl
          retention-days: 30

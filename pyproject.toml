[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spec-review"
version = "0.1.0"
description = "Requirements as code: an LLM-assisted reviewer for engineering requirements"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohiith Gettala Balachandar" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]
# torch comes from the CPU wheel index: pip install torch --index-url https://download.pytorch.org/whl/cpu
lora = ["transformers>=4.51", "peft>=0.13"]
ml = ["sentence-transformers>=3"]
graph = ["neo4j>=5.20"]

[project.scripts]
spec-review = "spec_review.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_review"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "RET", "C4"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["spec_review"]

[tool.ruff.lint.per-file-ignores]
"src/spec_review/cli.py" = ["PLR0917"]  # Typer maps parameters to CLI flags

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src/spec_review"]

# torch/transformers are optional: typed when installed, Any when not (as in the lint CI job).
[[tool.mypy.overrides]]
module = "spec_review.classify.lora"
disallow_subclassing_any = false
disallow_untyped_calls = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "data: needs the prepared datasets (skipped when missing)",
  "llm: needs a running model server (skipped when missing)",
]

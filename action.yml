name: spec-review
description: Review requirement files on pull requests against INCOSE and ISO/IEC/IEEE 29148 writing rules.
author: Rohiith Gettala Balachandar
branding:
  icon: check-square
  color: blue

inputs:
  files:
    description: Space-separated glob patterns of requirement files (.req, .txt, .md, .reqif)
    default: "**/*.req **/*.reqif"
  fail-on-findings:
    description: Fail the step when any requirement has a finding
    default: "false"
  report:
    description: Path of an HTML report to write (empty for none)
    default: ""

outputs:
  findings:
    description: Number of findings across all files
    value: ${{ steps.lint.outputs.findings }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install spec-review
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Lint requirement files
      id: lint
      shell: bash
      env:
        PATTERNS: ${{ inputs.files }}
        FAIL: ${{ inputs.fail-on-findings }}
        REPORT: ${{ inputs.report }}
      run: |
        shopt -s globstar nullglob
        files=()
        for pattern in $PATTERNS; do files+=($pattern); done
        if [ ${#files[@]} -eq 0 ]; then echo "No requirement files match: $PATTERNS"; echo "findings=0" >> "$GITHUB_OUTPUT"; exit 0; fi
        total=0
        for f in "${files[@]}"; do
          spec-review lint "$f" --format github
          n=$(spec-review lint "$f" --format json | python -c "import json,sys; print(sum(len(r['findings']) for r in json.load(sys.stdin)))")
          total=$((total + n))
          echo "| \`$f\` | $n |" >> "$RUNNER_TEMP/spec-review-rows.md"
        done
        {
          echo "### Requirements review"
          echo
          echo "| file | findings |"
          echo "|---|---:|"
          cat "$RUNNER_TEMP/spec-review-rows.md"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "findings=$total" >> "$GITHUB_OUTPUT"
        if [ -n "$REPORT" ]; then spec-review report "${files[@]}" --out "$REPORT"; fi
        if [ "$FAIL" = "true" ] && [ "$total" -gt 0 ]; then
          echo "::error::spec-review found $total issues in the requirement files"
          exit 1
        fi
